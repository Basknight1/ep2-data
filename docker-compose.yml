services:
  db:
    image: mysql:8
    container_name: ep2-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: proyecto_db
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./01_creacion_base_datos.sql:/docker-entrypoint-initdb.d/01_creacion_base_datos.sql

volumes:
  dbdata:
